spring:
  application:
    name: medislot
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medislot?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  allowed-origin: ${APP_ALLOWED_ORIGIN:*}
  zone-id: ${APP_ZONE_ID:Asia/Kolkata}

