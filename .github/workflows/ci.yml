name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # H2 suite runs everywhere; the MySQL Testcontainers test uses the runner's Docker daemon
      - name: Build and test
        run: mvn -B verify
